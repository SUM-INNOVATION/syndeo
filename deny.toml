# Run from day one. The failure mode this exists to prevent is discovering a GPL
# transitive dependency six months in.

[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    # Servo, Stylo and SpiderMonkey arrive at step four of the build order.
    # MPL is file-level copyleft: modifications to their files get published,
    # the surrounding code does not. GPL would not have been compatible.
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    # Boost, via clipboard-win and error-code under egui's clipboard support.
    # Permissive, OSI approved, and with no attribution requirement at all.
    "BSL-1.0",
    # The fonts egui embeds — Ubuntu Light, Hack, Noto Emoji. Both are font
    # licences rather than code licences: they permit embedding and
    # redistribution, and their conditions bite on modifying and renaming the
    # font files, which we do not do. OFL's reserved-font-name clause is the one
    # to remember if that ever changes.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # The Mozilla CA root bundle, reached only with the `renderer` feature on:
    # it comes in under Servo's own net crate. A data licence rather than a code
    # one, and permissive. Worth noting that those roots are never consulted —
    # every one of Servo's loads is answered by the network process, which
    # verifies with the platform verifier instead.
    "CDLA-Permissive-2.0",
]

# libzstd is dual BSD-3-Clause / GPL-2.0. We take the BSD side.
[[licenses.clarify]]
name = "zstd-sys"
expression = "BSD-3-Clause"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Nothing that drags in OpenSSL: rustls is the only TLS in this tree.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[advisories]
version = 2
yanked = "deny"

# Every entry here is a decision, not a silencing. A vulnerability advisory is
# never ignored — the whole point of running this weekly is that one arriving
# against a dependency breaks the build the following Monday. These four are
# `unmaintained`, which is a statement about a crate's future rather than about
# a defect in it, and each says what would clear it.
ignore = [
    # bincode 1.3. Direct, and the encoding of two things that outlive the
    # process: the redb index records and the peer wire format. Bincode 2 is a
    # different encoding, so moving costs an index schema version and a protocol
    # version, and buys nothing until there is a defect to fix. Cleared by that
    # migration, deliberately and on its own.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3 encodes the cache index and the peer protocol; moving to 2 is a format migration" },

    # rustls-pemfile. Reads the proxy's own authority certificate off disk, a
    # file we wrote ourselves, at startup. rustls 0.23 has since absorbed this
    # into rustls-pki-types; cleared by reading the PEM through that instead.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile parses the proxy's own CA file; superseded by rustls-pki-types" },

    # instant and paste, both under libp2p 0.44 and neither reachable from
    # anything we call directly. Cleared by the libp2p bump, whenever the
    # sub-crate set moves.
    { id = "RUSTSEC-2024-0384", reason = "instant, transitively under libp2p 0.44" },

    # proc-macro-error, a build-time dependency of wry's macro crates. It runs
    # during compilation and is in no shipped binary, so "unmaintained" here
    # means a macro helper that will not gain features rather than code with a
    # future. Cleared when wry's own dependencies move.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, build-time only, under wry" },

    # ttf-parser, reached through owned_ttf_parser and ab_glyph under
    # sctk-adwaita — which is winit's Wayland client-side window decorations.
    # It parses a font in order to draw a titlebar, on Linux, and nothing
    # reaches it on macOS at all. Cleared when winit's decoration stack moves.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, under winit's Wayland titlebar decorations" },
    { id = "RUSTSEC-2024-0436", reason = "paste, transitively under libp2p 0.44" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
