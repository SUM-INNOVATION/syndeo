# EXPERIMENT (#58), removed before review: excluded domains in WebKit's
# proxy configuration, on macOS 14, 15 and 26.
name: direct-probe

on:
  push:
    branches: [fix-hsts-macos15]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SYNDEO_ALLOW_APP_TEST: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: hsts-probe
      - name: Build the proxy
        run: |
          cargo build --release --locked --target aarch64-apple-darwin -p syndeo-proxy
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/syndeo-proxy dist/
          codesign --force --sign - --options runtime dist/syndeo-proxy
      - name: Probe
        run: bash ci/direct-probe.sh "$PWD/dist/syndeo-proxy"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/direct-probe/
          if-no-files-found: warn
