# Cutting a release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces one tarball per platform, the macOS installer package of
# Syndeo.app, built from the same binaries as the macOS tarball, a SHA256SUMS
# file covering those four, and a GitHub release holding the five. install.sh
# reads exactly those names.
#
# A workflow_dispatch run is a dry run. It builds, signs if configured, checks
# and installs everything a tag would, and rehearses the publication on a
# draft named dryrun-<run id>, which it checks and deletes. It never publishes
# anything, and it never creates a tag.
#
# Signing is all or nothing, decided once by signing-config from the
# release-macos environment: its SYNDEO_EXPECT_SIGNED variable and its ten
# secrets, which ci/check-signing-config.sh reads before anything is signed.
# Signed, the macOS release goes through three jobs, in order, each given
# only its own share of the secrets and checking that share first:
# build-macos signs the binaries, makes the tarball, and assembles and signs
# Syndeo.app from the same binaries; notarize-binaries sends those binaries
# and that bundle to Apple once, together, and waits for the verdict; package
# staples that exact bundle, builds the installer package from it, signs it,
# sends it to Apple once, waits, and staples it. Apple's two waits are in separate
# jobs, so neither shares a job's time limit with the other. The rest of
# the release needs both. Only those four jobs declare release-macos; it is
# a boundary for the signing configuration and nothing more: no required
# reviewers and no wait timer, so no run waits for anyone there.
#
# The installer package's bytes, from package to publication, by one
# SHA-256: package gives the SHA-256 of the package it made as its output,
# pkg-sha256. pkg-install (every state the package handles), acceptance (one
# customer's journey) and checksums each require the package they download
# to have exactly that SHA-256 before they use it. acceptance gives the
# SHA-256 it accepted as its output, and only once the journey has passed.
# publish and rehearse, before any draft, require acceptance's SHA-256 to be
# package's, the package they are about to upload to have it, and SHA256SUMS
# to list it so; their check of the draft then requires the draft's assets
# to be those bytes. The package published is the package accepted, signed,
# notarized and stapled, with Gatekeeper accepting it; a dry run rehearses
# the same with the package it would publish. No release job reads another
# run's artifacts, and none names a pull request's unsigned package.
# ci/check-workflows.py, run on every pull request, keeps all of this so.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (a dry run; nothing is published)"
        required: true

# Read-only, unless a job says otherwise: only the two that make a release
# do, and neither of them sees a secret.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3

jobs:
  # A tag that disagrees with the workspace version produces binaries whose
  # `--version` lies about which release they came from. Cheapest possible
  # place to catch that.
  verify:
    name: version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          set -euo pipefail
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            wanted="${{ inputs.version }}"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            wanted="${GITHUB_REF_NAME#v}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$manifest" != "$wanted" ]; then
            echo "::error::Cargo.toml says $manifest, the tag says $wanted. Bump [workspace.package] version first."
            exit 1
          fi
          echo "version=$wanted" >> "$GITHUB_OUTPUT"

  build-linux:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      # Built on 22.04 rather than the newest image on purpose: the glibc a
      # binary is linked against is the oldest one it will run on.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p syndeo-shell -p syndeo-net -p syndeo-keystore \
            -p syndeo-agent -p syndeo-proxy -p syndeo-ui

      - name: Package
        shell: bash
        run: ./ci/package.sh "${{ needs.verify.outputs.version }}" "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: syndeo-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # Whether this release is signed, decided once: release-macos's
  # SYNDEO_EXPECT_SIGNED and all eleven signing names, all or nothing. It signs
  # nothing. Every job that signs or notarizes declares the same environment,
  # is given only its own share of the secrets, and checks that share against
  # this decision before it uses any of them.
  signing-config:
    name: the signing configuration
    needs: verify
    runs-on: ubuntu-22.04
    environment: release-macos
    outputs:
      signed: ${{ steps.gate.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - name: The signing configuration, all or nothing
        id: gate
        env:
          SYNDEO_EXPECT_SIGNED: ${{ vars.SYNDEO_EXPECT_SIGNED }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          SYNDEO_PROVISIONING_PROFILE_B64: ${{ secrets.SYNDEO_PROVISIONING_PROFILE_B64 }}
        run: ./ci/check-signing-config.sh --github-output

  # The macOS binaries: built, and Developer ID signed and checked if the
  # configuration says so; the tarball made from them; and Syndeo.app,
  # assembled from the same binaries, its helper the tarball's syndeo-proxy,
  # and signed after them (ad hoc if the configuration says unsigned).
  # Nothing is notarized here. The tarball and the bundle, as a ZIP, go on as
  # internal artifacts, with their SHA-256s as this job's outputs, so the
  # jobs after it can require the same bytes.
  build-macos:
    name: aarch64-apple-darwin, built and signed
    needs: [verify, signing-config]
    runs-on: macos-15
    environment: release-macos
    outputs:
      tarball-sha256: ${{ steps.tarball.outputs.sha256 }}
      app-sha256: ${{ steps.tarball.outputs.app-sha256 }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SIGNED: ${{ needs.signing-config.outputs.signed }}
      TARBALL: syndeo-${{ needs.verify.outputs.version }}-aarch64-apple-darwin.tar.gz
      APPZIP: Syndeo.app.zip
    steps:
      - uses: actions/checkout@v4

      - name: This job's share of the signing configuration
        env:
          SYNDEO_EXPECT_SIGNED: ${{ needs.signing-config.outputs.signed }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          SYNDEO_PROVISIONING_PROFILE_B64: ${{ secrets.SYNDEO_PROVISIONING_PROFILE_B64 }}
        run: ./ci/check-signing-config.sh --stage binary-sign

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-aarch64-apple-darwin

      # syndeo-webkit embeds WKWebView, so it exists on macOS and nowhere
      # else. Built separately for the same reason it is packaged separately:
      # on Linux that crate is a stub that exists to explain itself.
      # syndeo-app is Syndeo.app's executable, and in no tarball.
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin \
            -p syndeo-shell -p syndeo-net -p syndeo-keystore \
            -p syndeo-agent -p syndeo-proxy -p syndeo-ui -p syndeo-app
          cargo build --release --locked --target aarch64-apple-darwin \
            -p syndeo-webkit

      # ci/sign-macos.sh checks Syndeo.app's provisioning profile, then signs
      # and verifies the seven, then assembles Syndeo.app from them, with the
      # profile, and signs the bundle, its main executable with Apple's
      # browser passkey entitlement; without a notary key, which this job is
      # never given, it notarizes nothing. notarize-binaries does that.
      - name: Sign the binaries, then Syndeo.app
        if: needs.signing-config.outputs.signed == 'yes'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          PROFILE: ${{ secrets.SYNDEO_PROVISIONING_PROFILE_B64 }}
        run: ./ci/sign-macos.sh "target/aarch64-apple-darwin/release" --app "$VERSION" "$RUNNER_TEMP/app"

      - name: Syndeo.app, signed ad hoc, as the configuration decided
        if: needs.signing-config.outputs.signed == 'no'
        run: ./ci/sign-macos.sh "target/aarch64-apple-darwin/release" --app "$VERSION" "$RUNNER_TEMP/app"

      - name: The tarball
        shell: bash
        run: ./ci/package.sh "$VERSION" aarch64-apple-darwin

      # Signed, checked, and run: each binary's --version, and the keystore's
      # status. macOS kills a binary it refuses as it starts, as it killed the
      # keystore signed with a keychain access group, and that has to fail
      # here rather than after a notarization submission.
      - name: Check the signed binaries in the tarball, and run each of them
        if: needs.signing-config.outputs.signed == 'yes'
        env:
          SYNDEO_EXPECT_SIGNED: "yes"
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: bash ci/verify-pkg.sh signed-binaries "dist/$TARBALL" "$VERSION"

      # Likewise the bundle: exactly Syndeo.app, it and its helper signed as
      # the seven are, and the helper the tarball's syndeo-proxy, run.
      - name: Check the signed Syndeo.app, and run its helper
        if: needs.signing-config.outputs.signed == 'yes'
        env:
          SYNDEO_EXPECT_SIGNED: "yes"
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: bash ci/verify-pkg.sh signed-app "$RUNNER_TEMP/app/Syndeo.app" "$VERSION" --tarball "dist/$TARBALL"

      - name: The tarball's and Syndeo.app's SHA-256
        id: tarball
        run: |
          set -euo pipefail
          sum="$(shasum -a 256 "dist/$TARBALL" | cut -d' ' -f1)"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "$TARBALL: $sum" >> "$GITHUB_STEP_SUMMARY"
          /usr/bin/ditto -c -k --keepParent "$RUNNER_TEMP/app/Syndeo.app" "dist/$APPZIP"
          sum="$(shasum -a 256 "dist/$APPZIP" | cut -d' ' -f1)"
          echo "app-sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "$APPZIP: $sum" >> "$GITHUB_STEP_SUMMARY"

      # ci/sign-macos.sh leaves its keychain in the search list, and its
      # certificate behind if it fails part-way.
      - name: Remove what signing the binaries left, whatever happened
        if: always()
        run: |
          keychain="$RUNNER_TEMP/syndeo-signing.keychain-db"
          if [ -e "$keychain" ]; then security delete-keychain "$keychain"; fi
          rm -rf "$RUNNER_TEMP/certificate.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: internal-macos-tarball
          path: dist/syndeo-${{ env.VERSION }}-aarch64-apple-darwin.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: internal-macos-app
          path: dist/Syndeo.app.zip
          if-no-files-found: error

  # The signed binaries and Syndeo.app, sent to Apple once, together, and
  # waited for in a job of their own, so the wait does not share a job's time
  # with the package's.
  #
  # The time: a job on a hosted runner may run 360 minutes. 60 are kept for
  # setup and download (10), checks and the upload to Apple (10), what
  # follows acceptance (20), diagnostics such as fetching the notary's log
  # (10), and cleanup with a margin (10). That leaves a 300-minute deadline,
  # counted from the submission. timeout-minutes, 350, is only a backstop:
  # notarize.py gives up at its deadline first, so cleanup always runs.
  # Apple promises no duration. The first notarization for this team, of
  # the 0.1.6 binaries, took 2:21:24 from upload to ticket; that is one
  # sample. A deadline reached means unresolved, not rejected: nothing is
  # resubmitted, and the submission ID is kept in the record and the summary.
  notarize-binaries:
    name: the binaries, notarized
    needs: [verify, signing-config, build-macos]
    runs-on: macos-15
    environment: release-macos
    timeout-minutes: 350
    outputs:
      tarball-sha256: ${{ steps.tarball.outputs.sha256 }}
      app-sha256: ${{ steps.tarball.outputs.app-sha256 }}
      notarization: ${{ steps.verdict.outputs.notarization }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SIGNED: ${{ needs.signing-config.outputs.signed }}
      TARBALL: syndeo-${{ needs.verify.outputs.version }}-aarch64-apple-darwin.tar.gz
      APPZIP: Syndeo.app.zip
      NOTARY_DEADLINE_MINUTES: "300"
    steps:
      - uses: actions/checkout@v4

      - name: This job's share of the signing configuration
        env:
          SYNDEO_EXPECT_SIGNED: ${{ needs.signing-config.outputs.signed }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: ./ci/check-signing-config.sh --stage binary-notarize

      - uses: actions/download-artifact@v4
        with:
          name: internal-macos-tarball
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: internal-macos-app
          path: dist

      - name: The tarball and Syndeo.app build-macos made, byte for byte
        id: tarball
        env:
          WANT: ${{ needs.build-macos.outputs.tarball-sha256 }}
          WANT_APP: ${{ needs.build-macos.outputs.app-sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$WANT" "dist/$TARBALL" | shasum -a 256 -c -
          printf '%s  %s\n' "$WANT_APP" "dist/$APPZIP" | shasum -a 256 -c -
          echo "sha256=$WANT" >> "$GITHUB_OUTPUT"
          echo "app-sha256=$WANT_APP" >> "$GITHUB_OUTPUT"

      - name: Check and run the signed binaries again, before Apple sees them
        if: needs.signing-config.outputs.signed == 'yes'
        env:
          SYNDEO_EXPECT_SIGNED: "yes"
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: bash ci/verify-pkg.sh signed-binaries "dist/$TARBALL" "$VERSION"

      - name: Check the signed Syndeo.app again, before Apple sees it
        if: needs.signing-config.outputs.signed == 'yes'
        env:
          SYNDEO_EXPECT_SIGNED: "yes"
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app"
          /usr/bin/ditto -x -k "dist/$APPZIP" "$RUNNER_TEMP/app"
          bash ci/verify-pkg.sh signed-app "$RUNNER_TEMP/app/Syndeo.app" "$VERSION" --tarball "dist/$TARBALL"

      - name: The ZIP of exactly the seven executables and Syndeo.app
        if: needs.signing-config.outputs.signed == 'yes'
        run: python3 -I ci/notarize.py binaries-zip "dist/$TARBALL" "$VERSION" "$RUNNER_TEMP/app/Syndeo.app" "$RUNNER_TEMP/notarize.zip"

      - name: Submit the binaries to Apple, once
        if: needs.signing-config.outputs.signed == 'yes'
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: python3 -I ci/notarize.py submit "$RUNNER_TEMP/notarize.zip" --record notarization/binaries

      - name: Wait for Apple's verdict on the binaries
        if: needs.signing-config.outputs.signed == 'yes'
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: python3 -I ci/notarize.py wait --record notarization/binaries --deadline-minutes "$NOTARY_DEADLINE_MINUTES"

      - name: The verdict, for the package job
        id: verdict
        run: |
          set -euo pipefail
          if [ "$SIGNED" = yes ]; then
            python3 -I -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["outcome"] == "accepted" else 1)' \
              notarization/binaries/result.json
            echo "notarization=accepted" >> "$GITHUB_OUTPUT"
          else
            echo "notarization=not-signed" >> "$GITHUB_OUTPUT"
          fi

      - name: The submission, in the summary, whatever happened
        if: always()
        run: |
          if [ -f notarization/binaries/submission.json ]; then
            { echo "binaries: submission $(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' notarization/binaries/submission.json)"
              [ ! -f notarization/binaries/result.json ] || python3 -I -c 'import json,sys; r=json.load(open(sys.argv[1])); print("outcome:", r.get("outcome"), "-", r.get("message", ""))' notarization/binaries/result.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$RUNNER_TEMP/notarize.zip"

      - name: Keep the notarization record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-binaries
          path: notarization/binaries/
          if-no-files-found: ignore

  # The installer package, built from the Syndeo.app Apple accepted, only
  # once it has: it needs notarize-binaries, and checks the tarball and the
  # bundle are the same bytes. If signed, the bundle is stapled first, and
  # has to be unchanged but for its ticket, and accepted by Gatekeeper. Then
  # the package: Developer ID Installer signing, one submission and its own
  # wait, on the same terms as the binaries', and stapling and Gatekeeper
  # only after Apple accepted exactly that file.
  #
  # The time:
  # - each stapling, the bundle's before the submission and the package's
  #   after the verdict, is at most five attempts: 225 seconds of waiting,
  #   ten stapler commands each stopped at 60 seconds, and the copies and
  #   checks. Under 15 minutes each, 30 together;
  # - the inspection after stapling validates the bundle's ticket and the
  #   package's with ci/stapler-validate.sh: at most five attempts each, 225
  #   seconds of waiting and five commands of about 61 seconds, under 9
  #   minutes. Under 18 together;
  # - in the signed dry run of 0.2.0 (run 39520714210), everything else in
  #   this job took under a minute;
  # - the wait ends at its deadline, 285 minutes counted from the
  #   submission, and stapling follows only if Apple accepted before then.
  # So the worst case is about 332 minutes, inside the job's 350. The
  # deadline is 285, not the binaries' 300, to make room for the
  # validations.
  package:
    name: the installer package, signed and notarized
    needs: [verify, signing-config, build-macos, notarize-binaries]
    runs-on: macos-15
    environment: release-macos
    timeout-minutes: 350
    outputs:
      pkg-sha256: ${{ steps.pkg.outputs.sha256 }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SIGNED: ${{ needs.signing-config.outputs.signed }}
      TARBALL: syndeo-${{ needs.verify.outputs.version }}-aarch64-apple-darwin.tar.gz
      APPZIP: Syndeo.app.zip
      PKG: Syndeo-${{ needs.verify.outputs.version }}.pkg
      NOTARY_DEADLINE_MINUTES: "285"
    steps:
      - uses: actions/checkout@v4

      - name: This job's share of the signing configuration
        env:
          SYNDEO_EXPECT_SIGNED: ${{ needs.signing-config.outputs.signed }}
          MACOS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: ./ci/check-signing-config.sh --stage package

      - uses: actions/download-artifact@v4
        with:
          name: internal-macos-tarball
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: internal-macos-app
          path: dist

      - name: The tarball and Syndeo.app Apple accepted, byte for byte
        env:
          WANT: ${{ needs.notarize-binaries.outputs.tarball-sha256 }}
          WANT_APP: ${{ needs.notarize-binaries.outputs.app-sha256 }}
          NOTARIZATION: ${{ needs.notarize-binaries.outputs.notarization }}
        run: |
          set -euo pipefail
          case "$SIGNED:$NOTARIZATION" in
            yes:accepted | no:not-signed) ;;
            *) echo "::error::signed is '$SIGNED' but the binaries' notarization is '$NOTARIZATION'"; exit 1 ;;
          esac
          printf '%s  %s\n' "$WANT" "dist/$TARBALL" | shasum -a 256 -c -
          printf '%s  %s\n' "$WANT_APP" "dist/$APPZIP" | shasum -a 256 -c -

      - name: Staple Syndeo.app, which Apple accepted with the binaries, and ask Gatekeeper
        if: needs.signing-config.outputs.signed == 'yes'
        env:
          SYNDEO_EXPECT_SIGNED: "yes"
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: ./ci/sign-macos-pkg.sh staple-app "dist/$APPZIP" "$RUNNER_TEMP/app" diagnostics/stapling

      - name: Syndeo.app, signed ad hoc, as the configuration decided
        if: needs.signing-config.outputs.signed == 'no'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app"
          /usr/bin/ditto -x -k "dist/$APPZIP" "$RUNNER_TEMP/app"

      # A signed release's package: its scripts know from which version a
      # release's Syndeo.app holds its provisioning profile.
      - name: The package, from that Syndeo.app
        shell: bash
        env:
          SYNDEO_EXPECT_SIGNED: ${{ needs.signing-config.outputs.signed }}
        run: ./ci/package-macos-pkg.sh "$VERSION" "$RUNNER_TEMP/app/Syndeo.app" "$RUNNER_TEMP/unsigned"

      - name: Sign the package
        if: needs.signing-config.outputs.signed == 'yes'
        env:
          SYNDEO_EXPECT_SIGNED: "yes"
          MACOS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: ./ci/sign-macos-pkg.sh sign "$RUNNER_TEMP/unsigned/$PKG" "dist/$PKG" "$RUNNER_TEMP/pkg-state"

      - name: Submit the package to Apple, once
        if: needs.signing-config.outputs.signed == 'yes'
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: python3 -I ci/notarize.py submit "dist/$PKG" --record notarization/package

      - name: Wait for Apple's verdict on the package
        if: needs.signing-config.outputs.signed == 'yes'
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: python3 -I ci/notarize.py wait --record notarization/package --deadline-minutes "$NOTARY_DEADLINE_MINUTES"

      - name: Staple it, once Apple accepted it, and ask Gatekeeper
        if: needs.signing-config.outputs.signed == 'yes'
        env:
          SYNDEO_EXPECT_SIGNED: "yes"
          MACOS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
        run: ./ci/sign-macos-pkg.sh finish "dist/$PKG" "$RUNNER_TEMP/pkg-state" notarization/package diagnostics/stapling

      - name: The package, unsigned, as the configuration decided
        if: needs.signing-config.outputs.signed == 'no'
        run: mv "$RUNNER_TEMP/unsigned/$PKG" dist/

      - name: Inspect the package without installing it
        env:
          SYNDEO_EXPECT_SIGNED: ${{ needs.signing-config.outputs.signed }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: bash ci/verify-pkg.sh inspect "dist/$PKG" "$VERSION" --app "$RUNNER_TEMP/app/Syndeo.app"

      # The SHA-256 every later job requires of the package it downloads.
      - name: The package's SHA-256, which every later job requires
        id: pkg
        run: |
          set -euo pipefail
          sum="$(shasum -a 256 "dist/$PKG" | cut -d' ' -f1)"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "$PKG: $sum" >> "$GITHUB_STEP_SUMMARY"

      - name: The submission, in the summary, whatever happened
        if: always()
        run: |
          if [ -f notarization/package/submission.json ]; then
            { echo "package: submission $(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' notarization/package/submission.json)"
              [ ! -f notarization/package/result.json ] || python3 -I -c 'import json,sys; r=json.load(open(sys.argv[1])); print("outcome:", r.get("outcome"), "-", r.get("message", ""))' notarization/package/result.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -rf "$RUNNER_TEMP/unsigned" "$RUNNER_TEMP/pkg-state" "$RUNNER_TEMP/app"

      - name: Keep the notarization record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-package
          path: notarization/package/
          if-no-files-found: ignore

      # Only when this job failed once stapling had begun, the bundle's or
      # the package's:
      # - what Apple accepted, not stapled;
      # - the last copy stapling changed, or what was stapled, if any;
      # - each stapling attempt's record;
      # - stapler's output, and the other tools' view of each thing kept;
      # - the trust settings.
      # None of it is named .pkg. ci/sign-macos-pkg.sh writes it there and
      # nowhere else. Kept a week for diagnosis, and never downloaded by any
      # job: nothing in it can be published.
      - name: Keep the stapling diagnostics, on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: internal-staple-diagnostics
          path: diagnostics/stapling/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: syndeo-aarch64-apple-darwin
          path: |
            dist/syndeo-${{ env.VERSION }}-aarch64-apple-darwin.tar.gz
            dist/Syndeo-${{ env.VERSION }}.pkg
          if-no-files-found: error

  # The package as built, installed for real on a runner that has never seen
  # it, through the same guarded test every pull request runs, and the runner
  # put back. Signed, Gatekeeper has to accept it, downloaded, and the bundle
  # it installs; unsigned, to reject both. Only its logs are kept.
  #
  # The time. Signed, the test validates the installed bundle's ticket with
  # ci/stapler-validate.sh: at most five attempts, under 9 minutes. The same
  # test took 11 to 15 minutes on pull requests. So the worst case is about
  # 24 minutes, inside 90.
  pkg-install:
    name: the package, installed and removed on a fresh runner
    needs: [verify, build-macos, notarize-binaries, package]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SYNDEO_ALLOW_SYSTEM_INSTALL_TEST: "yes"
      SYNDEO_EXPECT_SIGNED: ${{ needs.notarize-binaries.outputs.notarization == 'accepted' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: syndeo-aarch64-apple-darwin
          path: dist
      - name: The package
        run: echo "PKG=$GITHUB_WORKSPACE/dist/Syndeo-$VERSION.pkg" >> "$GITHUB_ENV"
      - name: The package, byte for byte the one package made
        env:
          WANT: ${{ needs.package.outputs.pkg-sha256 }}
        run: printf '%s  %s\n' "$WANT" "dist/Syndeo-$VERSION.pkg" | shasum -a 256 -c -

      - name: Install it, open it, upgrade, break, repair, move to the Trash and remove it, over the v0.1.x packages and install.sh's commands
        run: bash ci/test-pkg-install.sh run "$PKG" "$VERSION"

      - name: Put the runner back, whatever happened
        if: always()
        run: bash ci/test-pkg-install.sh cleanup

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-package-logs
          path: ${{ runner.temp }}/syndeo-pkg-test/logs/
          if-no-files-found: warn

  # One customer's journey (ci/test-journey.sh), as every pull request runs
  # it, with the exact package this run would publish, on a fresh runner:
  # downloaded and quarantined; Gatekeeper's verdict, which, signed, has to
  # accept the package and the Syndeo.app it installs, and, unsigned, to
  # reject both; installed, used, quit and opened again, installed again,
  # removed; and the runner put back. Its output is the SHA-256 it accepted,
  # set only once the journey has passed; publish and rehearse upload
  # nothing else. No secrets and no environment; only its logs are kept.
  #
  # The time. The journey validates the package's ticket and the installed
  # bundle's, each with ci/stapler-validate.sh, at most 9 minutes each,
  # under 18 together. The rest of the journey took 2.5 to 3.1 minutes in
  # runs of 2026-10-20 and 21. So the worst case is about 21 minutes, inside
  # 30.
  acceptance:
    name: the package, a customer's journey on a fresh runner
    needs: [verify, build-macos, notarize-binaries, package]
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      accepted-sha256: ${{ steps.accepted.outputs.sha256 }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SYNDEO_ALLOW_SYSTEM_INSTALL_TEST: "yes"
      SYNDEO_ALLOW_APP_TEST: "yes"
      SYNDEO_EXPECT_SIGNED: ${{ needs.notarize-binaries.outputs.notarization == 'accepted' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: syndeo-aarch64-apple-darwin
          path: dist
      - name: The package, byte for byte the one package made
        env:
          WANT: ${{ needs.package.outputs.pkg-sha256 }}
        run: printf '%s  %s\n' "$WANT" "dist/Syndeo-$VERSION.pkg" | shasum -a 256 -c -

      - name: Download it, install it, use it, quit and open it again, install it again, and remove it
        env:
          WANT: ${{ needs.package.outputs.pkg-sha256 }}
        run: bash ci/test-journey.sh run "$GITHUB_WORKSPACE/dist/Syndeo-$VERSION.pkg" "$VERSION" "$WANT"

      - name: Accepted, and only now its SHA-256 handed on
        id: accepted
        env:
          WANT: ${{ needs.package.outputs.pkg-sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$WANT" "dist/Syndeo-$VERSION.pkg" | shasum -a 256 -c -
          echo "sha256=$WANT" >> "$GITHUB_OUTPUT"
          echo "accepted: Syndeo-$VERSION.pkg, SHA-256 $WANT" >> "$GITHUB_STEP_SUMMARY"

      - name: Put the runner back, whatever happened
        if: always()
        run: bash ci/test-journey.sh cleanup

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-journey-logs
          path: |
            ${{ runner.temp }}/syndeo-journey/logs/
            ${{ runner.temp }}/syndeo-app-test/
          if-no-files-found: warn

  # Exactly the three tarballs and the package, named for this version, and
  # one SHA256SUMS over them, so install.sh fetches one checksum list and not
  # one per platform. Dry runs too.
  checksums:
    name: checksums
    needs: [verify, build-linux, build-macos, notarize-binaries, package]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: syndeo-*
          path: dist
          merge-multiple: true
      - name: The package, byte for byte the one package made
        env:
          WANT: ${{ needs.package.outputs.pkg-sha256 }}
        run: printf '%s  %s\n' "$WANT" "dist/Syndeo-$VERSION.pkg" | shasum -a 256 -c -
      - name: Exactly the four assets, and SHA256SUMS over them
        run: bash ci/verify-pkg.sh release sums dist "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  # A tag's release: a draft first, then its assets downloaded back and
  # checked against what was built, and its notes against what they should
  # say; only then is it published. If any of that fails, the draft stays a
  # draft and nothing is public.
  publish:
    name: publish
    needs: [verify, signing-config, build-macos, notarize-binaries, package, pkg-install, acceptance, checksums]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SIGNED: ${{ needs.signing-config.outputs.signed }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: The package acceptance accepted, and nothing else, byte for byte
        env:
          WANT: ${{ needs.package.outputs.pkg-sha256 }}
          ACCEPTED: ${{ needs.acceptance.outputs.accepted-sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$ACCEPTED" ] || [ "$ACCEPTED" != "$WANT" ]; then
            echo "::error::acceptance accepted '$ACCEPTED'; package made '$WANT'"
            exit 1
          fi
          printf '%s  %s\n' "$ACCEPTED" "dist/Syndeo-$VERSION.pkg" | shasum -a 256 -c -
          if ! grep -qxF "$ACCEPTED  Syndeo-$VERSION.pkg" dist/SHA256SUMS; then
            echo "::error::SHA256SUMS does not list Syndeo-$VERSION.pkg as $ACCEPTED"
            exit 1
          fi
      - name: A draft first
        run: |
          set -euo pipefail
          bash ci/release-notes.sh "$VERSION" "$SIGNED" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" \
            "dist/syndeo-$VERSION-aarch64-apple-darwin.tar.gz" \
            "dist/syndeo-$VERSION-aarch64-unknown-linux-gnu.tar.gz" \
            "dist/syndeo-$VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/Syndeo-$VERSION.pkg" \
            dist/SHA256SUMS \
            --draft --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - name: The draft, downloaded and checked
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --json isDraft --jq .isDraft | grep -qx true
          gh release download "v$VERSION" --dir "$RUNNER_TEMP/draft"
          gh release view "v$VERSION" --json body --jq .body > "$RUNNER_TEMP/draft-notes.md"
          bash ci/verify-pkg.sh release check "$RUNNER_TEMP/draft" "$VERSION" --against dist \
            --notes "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/draft-notes.md"
      - name: Published, only now
        run: gh release edit "v$VERSION" --draft=false --latest

  # A dry run's rehearsal of the same: a draft named dryrun-<run id>, made
  # and checked exactly as publish does, then deleted. It is never published,
  # so its tag is never created; the last step fails if either remains.
  rehearse:
    name: rehearse the draft (dry run, never published)
    needs: [verify, signing-config, build-macos, notarize-binaries, package, pkg-install, acceptance, checksums]
    if: needs.verify.outputs.publish != 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SIGNED: ${{ needs.signing-config.outputs.signed }}
      GH_TOKEN: ${{ github.token }}
      TAG: dryrun-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: The package acceptance accepted, and nothing else, byte for byte
        env:
          WANT: ${{ needs.package.outputs.pkg-sha256 }}
          ACCEPTED: ${{ needs.acceptance.outputs.accepted-sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$ACCEPTED" ] || [ "$ACCEPTED" != "$WANT" ]; then
            echo "::error::acceptance accepted '$ACCEPTED'; package made '$WANT'"
            exit 1
          fi
          printf '%s  %s\n' "$ACCEPTED" "dist/Syndeo-$VERSION.pkg" | shasum -a 256 -c -
          if ! grep -qxF "$ACCEPTED  Syndeo-$VERSION.pkg" dist/SHA256SUMS; then
            echo "::error::SHA256SUMS does not list Syndeo-$VERSION.pkg as $ACCEPTED"
            exit 1
          fi
      - name: A draft that is never published
        run: |
          set -euo pipefail
          bash ci/release-notes.sh "$VERSION" "$SIGNED" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            "dist/syndeo-$VERSION-aarch64-apple-darwin.tar.gz" \
            "dist/syndeo-$VERSION-aarch64-unknown-linux-gnu.tar.gz" \
            "dist/syndeo-$VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/Syndeo-$VERSION.pkg" \
            dist/SHA256SUMS \
            --draft --target "$GITHUB_SHA" --title "$TAG (dry run of v$VERSION, never published)" \
            --notes-file "$RUNNER_TEMP/notes.md"
      - name: The draft, downloaded and checked as publish checks it
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft --jq .isDraft | grep -qx true
          gh release download "$TAG" --dir "$RUNNER_TEMP/draft"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/draft-notes.md"
          bash ci/verify-pkg.sh release check "$RUNNER_TEMP/draft" "$VERSION" --against dist \
            --notes "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/draft-notes.md"
      - name: Deleted, whatever happened, and nothing left
        if: always()
        run: |
          set -uo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::the dry-run draft $TAG is still there"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::a tag $TAG exists; a dry run must never create one"
            exit 1
          fi
          echo "the dry-run draft $TAG is deleted, and no tag $TAG exists"
