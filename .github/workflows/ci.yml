# Throwaway: Syndeo.app's sidebar and memory with 10, 30 and 50 tabs, measured
# by ci/test-app.sh sidebar, alone on a runner, for a before and after
# comparison (PR #70's RAM review). Started by hand; never on a push or a PR.
name: CI

on:
  workflow_dispatch:

jobs:
  sidebar-memory:
    name: Syndeo.app's sidebar and memory, measured
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SYNDEO_ALLOW_APP_TEST: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-app
          save-if: false

      - name: Build the app and its helper
        run: cargo build --release --locked --target aarch64-apple-darwin -p syndeo-app -p syndeo-proxy

      - name: Assemble Syndeo.app, then sign it ad hoc, the helper first
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          bash ci/package-macos-app.sh "$version" target/aarch64-apple-darwin/release dist
          codesign --force --sign - --options runtime dist/Syndeo.app/Contents/Helpers/syndeo-proxy
          codesign --force --sign - --options runtime dist/Syndeo.app
          codesign --verify --strict --verbose=2 dist/Syndeo.app

      - name: The sidebar and the app's memory with 10, 30 and 50 tabs
        run: bash ci/test-app.sh sidebar "$PWD/dist/Syndeo.app"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-memory-logs
          path: ${{ runner.temp }}/syndeo-app-test/
          if-no-files-found: warn
