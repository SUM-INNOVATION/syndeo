# What every commit has to survive. The release workflow builds the same
# binaries from the same lock file, so a green run here is what makes a tag
# worth cutting.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The renderer job only. Servo is an hour of compilation, so it is checked on
  # a cadence rather than on every commit; bit-rot there is found in a week
  # instead of at the next release.
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A build that differs from the lock file is a build nobody reviewed.
  CARGO_NET_RETRY: 3
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  scripts:
    name: scripts (${{ matrix.os }})
    # The installer, run for real against a release made on the spot, and the
    # release verifier's judgement against stand-ins: no network, no Rust.
    # Both platforms, because the two ship different sed, grep and tar.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/test-install.sh
      - run: bash ci/verify-release.sh --self-test
      # The macOS package's root scripts, under a temporary root, with
      # stand-ins for pkgutil and codesign, over every state they handle; a
      # package built from a compiled stand-in Syndeo.app, inspected; on
      # Linux, the version grammar, the rendering and the release's assets.
      - run: bash ci/verify-pkg.sh --self-test
      # The signing configuration gate, every partial and contradictory state
      # of it; and the package's signing order, with stand-ins for the tools
      # (macOS only). A pull request never signs anything.
      - run: bash ci/check-signing-config.sh --self-test
      # The release's notarization: one submission per file, its ID recorded
      # before any wait, and every verdict, timeout and API error handled,
      # with a stand-in for notarytool. A pull request never notarizes.
      - run: python3 -I ci/notarize.py --self-test
      # The binaries' signing, with stand-ins for the tools: all seven alike,
      # and none with an entitlement, which a standalone executable cannot
      # carry without being killed at launch; and Syndeo.app after them, its
      # helper not signed again.
      - run: bash ci/sign-macos.sh --self-test
      # Syndeo.app's assembly: exactly its six files, its uninstaller
      # included, signed or stapled, and every way a bundle can differ from
      # that caught (macOS only).
      - run: bash ci/package-macos-app.sh --self-test
      # The app's mutants, which the app job builds and has to catch: each
      # still applies to the source exactly once.
      - run: python3 -I ci/macos-app/mutants.py --check .
      - run: bash ci/sign-macos-pkg.sh --self-test
      # Where the signing secrets may go: nowhere in this workflow, and in
      # release.yml only to the four jobs that declare release-macos, each its
      # own share, after its gate; and the macOS release's order, its one
      # tarball, every signed binary run before Apple sees any of them, and
      # one submission per file within each job's time.
      - run: python3 -I ci/check-workflows.py
      - run: python3 -I ci/check-workflows.py --self-test
      # Nothing a pull request runs may see a signing or notarization secret.
      - name: This workflow reads no secrets and no environment
        shell: bash
        run: |
          if grep -nE 'secrets\.|^[[:space:]]*environment:' .github/workflows/ci.yml; then
            echo "::error::ci.yml must not reference secrets or an environment"
            exit 1
          fi

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
          - name: macos-aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Warnings are errors here and nowhere else: a developer's own build stays
      # usable while a half-finished thought is on screen.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          # macOS only: drive a real WKWebView through an authenticating proxy
          # against the default WebKit data store, which is only acceptable on a
          # machine that is thrown away afterwards.
          SYNDEO_WEBKIT_UI_TEST: ${{ runner.os == 'macOS' && '1' || '' }}
          # macOS only: find and delete a certificate in a throwaway keychain
          # that the test creates, names on every command, and deletes, and
          # which it checks leaves the user's keychain search list as it was.
          SYNDEO_KEYCHAIN_TEST: ${{ runner.os == 'macOS' && '1' || '' }}
          # macOS only: the keystore as shipped, without a keychain access
          # group, against the real ordinary keychain — one generic-password
          # item under a service name of its own, written, read and deleted in
          # the default keychain, which is only acceptable on a machine that is
          # thrown away afterwards.
          SYNDEO_KEYSTORE_KEYCHAIN_TEST: ${{ runner.os == 'macOS' && '1' || '' }}

  macos-package:
    name: macOS package (installed and removed on a disposable runner)
    # The release binaries and Syndeo.app, built as release.yml's build-macos
    # builds them, the app assembled and signed ad hoc by ci/sign-macos.sh
    # --app as an unsigned release is, and the tarball made; the installer
    # package built from the app, and inspected without installing it; then
    # installed for real, opened, and taken through every state the package
    # handles, the published v0.1.x packages and install.sh's commands
    # included; and the runner put back, whatever happened. Unsigned, with no
    # secrets: a pull request never signs, and Gatekeeper has to reject what
    # it builds. Besides the logs, the package is kept for one day as
    # pr-package-adhoc-unsigned-<the commit built>, with its SHA-256 as this
    # job's output, for macos-journey alone: it is unsigned, Gatekeeper
    # rejects it, and no release job can read it (a release run reads only
    # its own run's artifacts, and ci/check-workflows.py keeps release.yml
    # from naming it or reaching into another run).
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      pkg-sha256: ${{ steps.pkg.outputs.sha256 }}
    env:
      SYNDEO_ALLOW_SYSTEM_INSTALL_TEST: "yes"
      SYNDEO_EXPECT_SIGNED: "no"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-package

      - name: Build the release binaries and the app
        run: |
          cargo build --release --locked --target aarch64-apple-darwin \
            -p syndeo-shell -p syndeo-net -p syndeo-keystore \
            -p syndeo-agent -p syndeo-proxy -p syndeo-ui -p syndeo-app
          cargo build --release --locked --target aarch64-apple-darwin \
            -p syndeo-webkit

      - name: Syndeo.app, signed ad hoc, the tarball, and the package built from the app
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          {
            echo "VERSION=$version"
            echo "APP=$GITHUB_WORKSPACE/dist/app/Syndeo.app"
            echo "PKG=$GITHUB_WORKSPACE/dist/Syndeo-$version.pkg"
          } >> "$GITHUB_ENV"
          mkdir -p dist/app
          bash ci/sign-macos.sh target/aarch64-apple-darwin/release --app "$version" dist/app
          ./ci/package.sh "$version" aarch64-apple-darwin
          ./ci/package-macos-pkg.sh "$version" dist/app/Syndeo.app dist

      - name: The app's helper is the tarball's syndeo-proxy, byte for byte
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tarball"
          tar -xzf "dist/syndeo-$VERSION-aarch64-apple-darwin.tar.gz" -C "$RUNNER_TEMP/tarball"
          cmp "$APP/Contents/Helpers/syndeo-proxy" "$RUNNER_TEMP/tarball/syndeo-$VERSION-aarch64-apple-darwin/syndeo-proxy"

      - name: Inspect the package without installing it
        run: bash ci/verify-pkg.sh inspect "$PKG" "$VERSION" --app "$APP"

      - name: The package's SHA-256, and the package, unsigned, kept one day for macos-journey
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          sum="$(shasum -a 256 "$PKG" | cut -d' ' -f1)"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          {
            echo "### pr-package-adhoc-unsigned-$GITHUB_SHA"
            echo ""
            echo "Syndeo-$VERSION.pkg, SHA-256 \`$sum\`, built from $GITHUB_SHA (for a pull request, GitHub's merge of it into its base)."
            echo ""
            echo "**Unsigned:** signed ad hoc, with no Developer ID and no notarization, so **Gatekeeper rejects it**."
            echo "Kept one day, for this run's macos-journey job alone. It is not a release, no release job can read it, and it is not for installing."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-package-adhoc-unsigned-${{ github.sha }}
          path: ${{ env.PKG }}
          retention-days: 1
          if-no-files-found: error

      - name: Install it, open it, upgrade, break, repair, move to the Trash and remove it, over the v0.1.x packages and install.sh's commands
        run: bash ci/test-pkg-install.sh run "$PKG" "$VERSION"

      - name: Put the runner back, whatever happened
        if: always()
        run: bash ci/test-pkg-install.sh cleanup

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-logs
          path: ${{ runner.temp }}/syndeo-pkg-test/logs/
          if-no-files-found: warn

  macos-journey:
    name: Syndeo.app, a customer's journey on a pristine runner
    # One new customer, end to end (ci/test-journey.sh), with the exact
    # package macos-package made, required by its SHA-256, on a runner that
    # has built nothing: downloaded and quarantined; Gatekeeper's verdict,
    # which for this ad hoc package has to be a rejection; installed; opened
    # by its path, browsing https pinned with Syndeo's authority in no trust
    # settings, quit and opened again; installed again; removed; the trust
    # settings and keychains exactly as they were; and the runner put back,
    # whatever happened. Reload, pressed as a person presses it, has to
    # consult the origin through Syndeo's proxy, not be answered from the
    # proxy's cache alone. Nothing of Phase 4's states is repeated here. Only
    # the logs are kept. Fifteen minutes: the journey took 2.7 in PR #36's
    # run, and every wait inside it is bounded.
    needs: macos-package
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SYNDEO_ALLOW_SYSTEM_INSTALL_TEST: "yes"
      SYNDEO_ALLOW_APP_TEST: "yes"
      SYNDEO_EXPECT_SIGNED: "no"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pr-package-adhoc-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/package

      - name: The package, byte for byte the one macos-package made
        shell: bash
        env:
          WANT: ${{ needs.macos-package.outputs.pkg-sha256 }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          {
            echo "VERSION=$version"
            echo "PKG=$RUNNER_TEMP/package/Syndeo-$version.pkg"
          } >> "$GITHUB_ENV"
          printf '%s  %s\n' "$WANT" "$RUNNER_TEMP/package/Syndeo-$version.pkg" | shasum -a 256 -c -
          {
            echo "The journey's package: pr-package-adhoc-unsigned-$GITHUB_SHA, Syndeo-$version.pkg, SHA-256 \`$WANT\`."
            echo ""
            echo "**Unsigned** (ad hoc): **Gatekeeper rejects it**, and this journey requires that it does."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download it, install it, use it, quit and open it again, install it again, and remove it
        env:
          WANT: ${{ needs.macos-package.outputs.pkg-sha256 }}
        run: bash ci/test-journey.sh run "$PKG" "$VERSION" "$WANT"

      - name: Put the runner back, whatever happened
        if: always()
        run: bash ci/test-journey.sh cleanup

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-journey-logs
          path: |
            ${{ runner.temp }}/syndeo-journey/logs/
            ${{ runner.temp }}/syndeo-app-test/
          if-no-files-found: warn

  macos-app:
    name: Syndeo.app (opened and quit on a disposable runner)
    # The desktop application as a person starts it: assembled from release
    # binaries, signed ad hoc (the helper first, then the bundle), opened with
    # `open`, checked through Launch Services, the window server and
    # Accessibility; browsed in, by keystrokes and presses as a person would:
    # addresses, Back and Forward, refusals, search as Settings chooses it, a
    # tab opened and closed, no private URL in any log, https pinned through
    # the proxy, a page's own links to other schemes refused; its last window
    # closed and brought back by opening it again, quit as the Quit menu item
    # would, and opened again; seven mutants, each of which the test has to
    # catch; a copy whose proxy cannot start, which has to refuse to browse;
    # and the route bar against what WebKit does, the proxy's cache keeping
    # nothing from this Mac, and Clear Browsing Data. Unsigned with a
    # Developer ID, and with no secrets: a pull request never signs. Then,
    # reported and not gated, what this runner allows an onboarding test to do.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SYNDEO_ALLOW_APP_TEST: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-app

      - name: Build the app and its helper
        run: cargo build --release --locked --target aarch64-apple-darwin -p syndeo-app -p syndeo-proxy

      - name: Assemble Syndeo.app, then sign it ad hoc, the helper first
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          bash ci/package-macos-app.sh "$version" target/aarch64-apple-darwin/release dist
          codesign --force --sign - --options runtime dist/Syndeo.app/Contents/Helpers/syndeo-proxy
          codesign --force --sign - --options runtime dist/Syndeo.app
          codesign --verify --strict --verbose=2 dist/Syndeo.app

      - name: Open it, check it, browse in it, close its last window and open it again, quit it, and open it again
        run: bash ci/test-app.sh launch "$PWD/dist/Syndeo.app"

      # The same app with a helper that exits at once, so its proxy can never
      # start: it has to open, say it cannot browse, and hold no web view.
      - name: Assemble a Syndeo.app whose proxy cannot start
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p broken-bins dist-broken
          cp target/aarch64-apple-darwin/release/syndeo-app broken-bins/
          printf 'int main(void) { return 1; }\n' | clang -x c - -o broken-bins/syndeo-proxy
          bash ci/package-macos-app.sh "$version" broken-bins dist-broken
          codesign --force --sign - --options runtime dist-broken/Syndeo.app/Contents/Helpers/syndeo-proxy
          codesign --force --sign - --options runtime dist-broken/Syndeo.app
          codesign --verify --strict --verbose=2 dist-broken/Syndeo.app

      - name: Open it, and require it to refuse to browse
        run: bash ci/test-app.sh refuse "$PWD/dist-broken/Syndeo.app"

      # Syndeo.app with one safeguard taken out at a time (ci/macos-app/
      # mutants.py): the pinning delegate, the main frame's navigation policy,
      # the schemes a new tab may open, the address field's guard for typing,
      # the bar's rule for names, and the refusal of a link to an IPv6 address
      # with a zone. Each is built from this tree, which is then put back, and
      # the test has to catch each by the checks meant to, with every other
      # check passing. All six are run whatever any one does, each recorded
      # on its own and cleaned up after; the step fails at the end if any was
      # not caught exactly as intended.
      - name: Build each mutant, and require the test to catch it
        shell: bash
        run: |
          set -uo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          results=()
          wrong=0
          for name in $(python3 -I ci/macos-app/mutants.py names); do
            echo "::group::mutant $name"
            built=no
            if python3 -I ci/macos-app/mutants.py apply "$name" . &&
              cargo build --release --locked --target aarch64-apple-darwin -p syndeo-app; then
              built=yes
            fi
            # Put back whatever happened, and exactly.
            git checkout -- crates/syndeo-app
            if ! git diff --quiet; then
              echo "::error::the tree was not put back after mutant $name"
              exit 1
            fi
            verdict="caught as intended"
            if [ "$built" != yes ]; then
              verdict="NOT BUILT"
            elif ! { mkdir -p "mutant-bins/$name" "dist-mutant/$name" &&
              cp target/aarch64-apple-darwin/release/syndeo-app target/aarch64-apple-darwin/release/syndeo-proxy "mutant-bins/$name/" &&
              bash ci/package-macos-app.sh "$version" "mutant-bins/$name" "dist-mutant/$name" &&
              codesign --force --sign - --options runtime "dist-mutant/$name/Syndeo.app/Contents/Helpers/syndeo-proxy" &&
              codesign --force --sign - --options runtime "dist-mutant/$name/Syndeo.app"; }; then
              verdict="NOT ASSEMBLED"
            elif ! bash ci/test-app.sh mutant "$name" "$PWD/dist-mutant/$name/Syndeo.app"; then
              verdict="NOT CAUGHT AS INTENDED"
            fi
            # Nothing of this mutant left running for the next.
            pkill -x Syndeo 2>/dev/null || true
            pkill -x syndeo-proxy 2>/dev/null || true
            sleep 1
            [ "$verdict" = "caught as intended" ] || wrong=1
            results+=("$name: $verdict")
            echo "::endgroup::"
          done
          printf '\nmutants:\n'
          printf '  %s\n' "${results[@]}"
          [ "$wrong" = 0 ]

      # The route bar, gated against what WebKit actually does: each address
      # typed, from a fresh WebKit state and with a fresh token. For Direct
      # and Through Syndeo, the way WebKit went (by which process the origin
      # saw, or the proxy's own count) and what the bar says are both
      # required to be what the app's rule says; for Local, where the way
      # varies, the bar's label, and the proxy's cache taking nothing. Every
      # route measured before and each range's edges. Then the proxy caching
      # nothing from this Mac, and Clear Browsing Data.
      # For the time it gates it aliases addresses on lo0 and adds a
      # single-label name to /etc/hosts, and it fails if it cannot put those,
      # or the trust settings, back exactly as they were.
      - name: The route bar against WebKit's routes, the proxy's cache, and Clear Browsing Data
        if: always()
        run: bash ci/test-app.sh routes "$PWD/dist/Syndeo.app"

      # What WebSockets and WebRTC do in Syndeo.app, kept in realtime.txt in
      # the logs for the owner's decision. Nothing it sees is judged; it fails
      # only when it cannot measure.
      - name: WebSockets and WebRTC in Syndeo.app (measured, not a gate)
        if: always()
        run: bash ci/test-app.sh realtime "$PWD/dist/Syndeo.app"

      - name: What this runner allows (measured, not a gate)
        if: always()
        run: bash ci/test-app.sh measure

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-logs
          path: ${{ runner.temp }}/syndeo-app-test/
          if-no-files-found: warn

  deny:
    name: cargo-deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Licences over everything, renderer included. That allowlist exists
      # precisely so Servo's tree is covered: MPL-2.0 and CDLA-Permissive-2.0
      # are in it for no other reason, and a copyleft dependency arriving under
      # the renderer is exactly the thing it was written to catch.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
          arguments: --locked --all-features

      # Advisories over what ships, which is the renderer's opposite: Servo is
      # behind an off-by-default feature and left out of release archives from
      # v0.1.3 on, and its
      # dependency tree carries advisories nobody here can act on. Gating every
      # merge on those would train people to ignore this check. It is reported
      # weekly instead, by `servo-advisories` below, which never gates.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --locked

  renderer:
    name: renderer (Servo)
    # Weekly and on demand. Everything in syndeo-servo that could be written
    # without Servo is outside the feature gate and is covered by `test` above;
    # this job is what keeps the gated half compiling.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Servo's WebIDL codegen needs Python >= 3.11 as `python3`. The system
      # Python is older, and the failure is a SyntaxError hundreds of crates in
      # that names nothing.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: cargo check -p syndeo-servo --features renderer --locked

  servo-advisories:
    name: servo advisories (report, not shipped)
    # What the renderer's own dependency tree is carrying: weekly, and never a
    # gate, because it is a report on a tree we do not control and that sits
    # behind an off-by-default feature. What ships is gated by `deny` above on
    # every commit. This used to be the last step of `renderer`, where it could
    # never run: cargo-deny-action is a container action, and containers need
    # Linux. Reading advisories needs the lock file, not a Servo build, so it
    # lives on Linux in a job of its own.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20

      # Every finding and cargo-deny's own exit status go in the job summary,
      # whatever that status is. A non-zero status is a warning on the run
      # rather than a failure, because the tree it describes is not shipped.
      - name: Report
        shell: bash
        run: |
          set +e
          cargo deny --color never --locked --all-features check advisories > report.txt 2>&1
          status=$?
          set -e
          cat report.txt
          {
            echo "## Servo advisory report (not shipped, non-gating)"
            echo
            echo "\`cargo deny --locked --all-features check advisories\` exited with status **${status}**."
            echo "This covers every feature, the renderer included. What ships is gated separately, by the \`cargo-deny\` job."
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Servo advisory report::cargo-deny exited with status ${status} over every feature, the renderer included. The full findings are in the job summary."
          fi
