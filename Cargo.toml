[workspace]
resolver = "2"
members = ["crates/syndeo-cache", "crates/syndeo-net", "crates/syndeo-proxy", "crates/syndeo-ipc", "crates/syndeo-keystore", "crates/syndeo-dom", "crates/syndeo-agent", "crates/syndeo-shell", "crates/syndeo-peer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SUM-INNOVATION/syndeo"

[workspace.dependencies]
syndeo-cache = { path = "crates/syndeo-cache", version = "0.1.0" }
syndeo-net = { path = "crates/syndeo-net", version = "0.1.0" }
syndeo-ipc = { path = "crates/syndeo-ipc", version = "0.1.0" }
syndeo-keystore = { path = "crates/syndeo-keystore", version = "0.1.0" }
syndeo-dom = { path = "crates/syndeo-dom", version = "0.1.0" }
syndeo-peer = { path = "crates/syndeo-peer", version = "0.1.0" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "process", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"

hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "server", "http1", "http2"] }
http = "1"
http-body-util = "0.1"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }

redb = "2"
blake3 = "1"
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
zstd = "0.13"
base64 = "0.22"

ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hmac = "0.12"
zeroize = { version = "1", features = ["zeroize_derive"] }
rand = "0.8"
argon2 = { version = "0.5", features = ["std", "zeroize"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
bip39 = { version = "2", features = ["rand"] }
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }
subtle = "2"
rpassword = "7"
# Matching the sub-crate set sum-chain settled on: the libp2p umbrella pulls in
# libp2p-mdns and with it hickory-proto, which stays in the lock file whatever
# the features say. Depending on the exact sub-crates keeps it out.
libp2p-swarm = { version = "0.44", features = ["macros", "tokio"] }
libp2p-request-response = "0.26"
libp2p-tcp = { version = "0.41", features = ["tokio"] }
libp2p-noise = "0.44"
libp2p-yamux = "0.45"
libp2p-identify = "0.44"
libp2p-core = "0.41"
libp2p-identity = { version = "0.2", features = ["ed25519", "rand", "peerid"] }
async-trait = "0.1"
html5ever = "0.39"
markup5ever_rcdom = "0.39"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
url = "2"
httpdate = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "ring", "native-tokio", "logging"] }
hickory-resolver = { version = "0.24", features = ["dns-over-rustls", "dns-over-https-rustls", "tokio-runtime"] }
tower-service = "0.3"
directories = "5"
