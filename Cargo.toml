[workspace]
resolver = "2"
members = ["crates/syndeo-cache", "crates/syndeo-net", "crates/syndeo-proxy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SUM-INNOVATION/syndeo"

[workspace.dependencies]
syndeo-cache = { path = "crates/syndeo-cache", version = "0.1.0" }
syndeo-net = { path = "crates/syndeo-net", version = "0.1.0" }
syndeo-ipc = { path = "crates/syndeo-ipc", version = "0.1.0" }
syndeo-keystore = { path = "crates/syndeo-keystore", version = "0.1.0" }
syndeo-dom = { path = "crates/syndeo-dom", version = "0.1.0" }
syndeo-peer = { path = "crates/syndeo-peer", version = "0.1.0" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "process", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"

hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "server", "http1", "http2"] }
http = "1"
http-body-util = "0.1"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }

redb = "2"
blake3 = "1"
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
zstd = "0.13"
base64 = "0.22"

ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hmac = "0.12"
zeroize = { version = "1", features = ["zeroize_derive"] }
rand = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
url = "2"
httpdate = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "ring", "native-tokio", "logging"] }
hickory-resolver = { version = "0.24", features = ["dns-over-rustls", "dns-over-https-rustls", "tokio-runtime"] }
tower-service = "0.3"
directories = "5"
