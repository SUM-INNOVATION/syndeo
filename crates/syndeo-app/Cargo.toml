[package]
name = "syndeo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Syndeo for macOS: the desktop application, Syndeo.app"

# Bundled as Syndeo.app/Contents/MacOS/Syndeo; see ci/package-macos-app.sh.
[[bin]]
name = "syndeo-app"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
syndeo-shell.workspace = true
syndeo-webkit.workspace = true

# The versions syndeo-webkit builds its web view configuration and pinning
# delegate with: a different objc2 is a different `Retained<T>`, and the
# types would not meet.
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
# Only the classes this uses: the defaults would bring in bindings for
# CloudKit, Core Data, Core Image, Core Text and Core Video as well.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSAccessibilityProtocols",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPopUpButton",
    "NSProgressIndicator",
    "NSResponder",
    "NSText",
    "NSTextField",
    "NSRunningApplication",
    "NSView",
    "NSWindow",
] }
objc2-web-kit = "0.3"

security-framework.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
