[package]
name = "syndeo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Syndeo for macOS: the desktop application, Syndeo.app"

# Bundled as Syndeo.app/Contents/MacOS/Syndeo; see ci/package-macos-app.sh.
[[bin]]
name = "syndeo-app"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
syndeo-shell.workspace = true
syndeo-webkit = { path = "../syndeo-webkit" }

# The versions syndeo-webkit builds its web view configuration and pinning
# delegate with: a different objc2 is a different `Retained<T>`, and the
# types would not meet.
objc2 = "0.6"
objc2-foundation = "0.3"
# Only the classes this uses: the defaults would bring in bindings for
# CloudKit, Core Data, Core Image, Core Text and Core Video as well.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSView",
    "NSWindow",
] }
objc2-web-kit = "0.3"

tracing.workspace = true
tracing-subscriber.workspace = true
