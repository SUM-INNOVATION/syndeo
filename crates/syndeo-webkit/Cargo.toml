[package]
name = "syndeo-webkit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A renderer that works, confined to a proxy it cannot bypass"

[[bin]]
name = "syndeo-webkit"
path = "src/main.rs"

[dependencies]
# Common to every platform, so the stub still builds a binary that explains
# itself rather than failing to compile.
anyhow.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
syndeo-ipc.workspace = true
syndeo-shell.workspace = true

# WebKit through wry. `mac-proxy` is the whole reason this is viable: it lets
# the web view be pointed at a proxy it has no way to route around, which is how
# boundary one survives an engine that will not let an embedder answer loads.
wry = { version = "0.57", default-features = false, features = ["mac-proxy", "os-webview"] }
winit.workspace = true

# Matching wry's own versions exactly, because the pinning delegate is set on
# the web view wry built: a different objc2 is a different `Retained<T>` and the
# types will not meet.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
security-framework.workspace = true
core-foundation.workspace = true
base64.workspace = true

tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
